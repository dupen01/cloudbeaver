name: My Build and Push

on:
  push:
    branches:
      - 25.0.2

jobs:
  build:
    name: Build and Push Job
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.cn-chengdu.aliyuncs.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - uses: dbeaver/github-actions/install-maven@devel

      - name: Run build script
        run: ./build-backend.sh
        shell: bash
        working-directory: ./cloudbeaver/deploy

      - name: Set up NodeJs 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: webapp/yarn.lock

      - name: Run build script
        run: ./build.sh
        shell: bash
        working-directory: ./deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run custom Docker build script
        run: ./make-docker-container.sh
        shell: bash
        working-directory: ./deploy/docker

      - name: Tag Docker Image
        run: |
          REPO_NAME=$(basename ${{ github.repository }})
          IMAGE_NAME=$REGISTRY/duperl/$REPO_NAME
          BRANCH_NAME=${{ github.head_ref || github.ref_name }}
          TAG_NAME=$(echo $BRANCH_NAME | sed 's/[^a-zA-Z0-9._-]/-/g')
          docker tag dbeaver/cloudbeaver:dev $IMAGE_NAME:$TAG_NAME
          echo "image=$IMAGE_NAME:$TAG_NAME" >> $GITHUB_ENV

      - name: Log in to Aliyun Container Registry
        run: echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login $REGISTRY -u ${{ secrets.ALIYUN_USERNAME }} --password-stdin

      - name: Push Docker Image
        run: docker push ${{ env.image }}
