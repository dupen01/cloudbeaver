name: My Build and Push

on:
  push:
    branches:
      - 25.0.2

jobs:
  build:
    name: My Main Build Job
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.cn-chengdu.aliyuncs.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: maven

      - uses: dbeaver/github-actions/install-maven@devel

      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "yarn"
          cache-dependency-path: |
            ./common-*/yarn.lock
            ./webapp/yarn.lock

      - name: Run build script
        run: ./build.sh
        shell: bash
        working-directory: ./deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          REPO_NAME=$(basename ${{ github.repository }})
          IMAGE_NAME=$REGISTRY/duperl/$REPO_NAME
          BRANCH_NAME=${{ github.head_ref || github.ref_name }}
          TAG_NAME=$(echo $BRANCH_NAME | sed 's/[^a-zA-Z0-9._-]/-/g')
          docker build -t $IMAGE_NAME:$TAG_NAME \
          --platform=linux/amd64,linux/arm64 \
          --file ./docker/cloudbeaver-ce/Dockerfile .
          echo "image=$IMAGE_NAME:$TAG_NAME" >> $GITHUB_ENV
        working-directory: ./deploy

      - name: Log in to Aliyun Container Registry
        run: echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login $REGISTRY -u ${{ secrets.ALIYUN_USERNAME }} --password-stdin

      - name: Push Docker Image
        run: docker push ${{ env.image }}
